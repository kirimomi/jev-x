<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>jev-x</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f1419;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(0, 186, 124, 0.15);
      color: #00ba7c;
      font-weight: 600;
    }
    .status-badge.warning {
      background: rgba(255, 173, 31, 0.15);
      color: #ffad1f;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3e4144;
      transition: .2s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #1d9bf0; }
    input:checked + .slider:before { transform: translateX(18px); }
    .btn-options {
      width: 100%;
      box-sizing: border-box;
      background: #202327;
      color: #e7e9ea;
      border: 1px solid #2f3336;
      padding: 8px 0;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: block;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-options:hover {
      background: #2f3336;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛡️ jev-x</div>
    <div id="api-status" class="status-badge">API接続中</div>
  </div>

  <div class="toggle-row">
    <span>フィルタ有効化</span>
    <label class="switch">
      <input type="checkbox" id="global-toggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <button id="open-options" class="btn-options">詳細設定を開く</button>

  <script type="module" src="/src/extension/popup/popup.ts"></script>
</body>
</html>
